name: release-android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux libraries for host tests
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - uses: android-actions/setup-android@v3

      - name: Android SDK and NDK r28
        run: sdkmanager --install "platforms;android-37" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Set the ANDROID_KEYSTORE_BASE64 secret before tagging a release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moojot-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/moojot-release.jks" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          pnpm tauri android build --apk --target aarch64
          pnpm tauri android build --aab --target aarch64
          mkdir -p dist-release
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -path '*release*' -print0 |
            xargs -0 -I{} cp {} dist-release/
          cd dist-release
          sha256sum ./* > SHA256SUMS

      - name: Check 16 KB ELF alignment
        run: |
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          tmp="$(mktemp -d)"
          apk="$(find dist-release -name '*.apk' | head -n 1)"
          unzip -q "$apk" -d "$tmp"
          bad=0
          while IFS= read -r -d '' so; do
            if ! "$readelf" -l "$so" | awk '/LOAD/ { align = strtonum($NF); if (align < 16384) bad = 1 } END { exit bad }'; then
              echo "Not 16 KB aligned: $so"
              bad=1
            fi
          done < <(find "$tmp/lib" -name '*.so' -print0)
          exit "$bad"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --title "MooJot $GITHUB_REF_NAME" \
            --notes "Signed Android build. Privacy policy: docs/privacy-policy.md"
