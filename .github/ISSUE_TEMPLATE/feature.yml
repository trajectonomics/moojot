name: ✨ Feature request
description: Suggest new behavior or a change to how moojot works.
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! 🐷
        A bot reads this and drafts a spec. The maintainer decides what gets built.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and the pain, not the solution yet.
      placeholder: At the end of the month I can't tell which category I overspent in.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like moojot to do?
      placeholder: Show a monthly summary grouped by category, with the biggest ones first.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Optional. Workarounds, or how other apps (e.g. Meowjot) handle it.
  - type: textarea
    id: extra
    attributes:
      label: Mockups, examples, links
      description: Optional.
