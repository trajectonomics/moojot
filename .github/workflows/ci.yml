name: ci
# Runs on every pull request and every push to main. This is the `ci_green`
# gate in .factory/config.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (check, unit, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Headless Chrome is preinstalled on GitHub's Ubuntu runners.
      - name: Swipe width regression test
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: pnpm test:e2e

  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Compares every scene in tests/screenshots/scenes.mjs with the committed
      # baseline. The baselines are made on this runner (see the steps below),
      # because text rendering differs between machines.
      - name: Screenshot test
        id: compare
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: pnpm test:screenshots

      - name: Upload the diff report
        if: failure() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diff
          path: tests/screenshots/output
          if-no-files-found: ignore

      # The baselines as this runner draws them. When the change is intended,
      # download this artifact over tests/screenshots/baseline and commit it.
      - name: Make baselines on this runner
        if: failure() && steps.compare.outcome == 'failure'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: pnpm test:screenshots:update --no-build

      - name: Upload the new baselines
        if: failure() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: tests/screenshots/baseline

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for host tests
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! needs frontendDist (../build) to exist; the
      # tests don't need the real frontend, so an empty folder is enough.
      - name: Placeholder frontend
        run: mkdir -p build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
